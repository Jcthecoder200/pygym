[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
# CHANGE THIS if "pygym" is already taken on PyPI (check https://pypi.org/project/pygym/ first).
# The name you pip install can differ from the import name, which stays `pygym`.
name = "pygym_cityu"
dynamic = ["version"]          # single source of truth: src/pygym/__init__.py -> __version__
description = "Micro-exercises that teach Python built-ins, right inside your coding environment."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
# CHANGE THIS: your own name / team name.
authors = [
    { name = "pygym_cityu_contributors" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]
dependencies = ["rich>=13.0"]

[project.optional-dependencies]
llm = []          # stretch goal: LLM mode dependencies go here
dev = ["pytest"]

[project.urls]
# CHANGE THIS once the GitHub repo exists: PyPI shows it on the project page.
Homepage = "https://github.com/Jcthecoder200/pygym"
Changelog = "https://github.com/Jcthecoder200/pygym/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "pygym.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["pygym*"]

[tool.setuptools.package-data]
# Ships the exercise dataset inside the installed package.
# Without this, pip install would silently omit it and exercise() would find nothing.
pygym = ["data/*.json"]
